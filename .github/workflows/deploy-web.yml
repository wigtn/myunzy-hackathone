name: Deploy Web (Vercel)

# web/ 변경이 main에 머지되면 Vercel 프로덕션에 자동 배포.
# 필요한 GitHub Secret: VERCEL_TOKEN (Vercel 대시보드 → Account → Tokens 에서 발급 후 등록).
# ORG/PROJECT ID 는 비밀이 아니라 식별자라 여기 인라인(.vercel/project.json 값).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

env:
  VERCEL_ORG_ID: team_uAaaPnol5pA0PpIP6NMf5rF6
  VERCEL_PROJECT_ID: prj_SZwHOmMGqQK4gXuUQhMsIjmcktuI

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vercel CLI 설치
        run: npm i -g vercel@latest

      - name: Vercel 프로젝트 설정/환경 pull
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"

      - name: 프로덕션 빌드
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"

      - name: 프로덕션 배포
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
